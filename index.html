<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA com Hardware</title>
    
    <!-- Linkando o Manifesto para virar PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    
    <!-- Linkando o arquivo de estilo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Meu PWA com Geolocalização</h1>
        <button id="btn-geo">Obter Minha Localização</button>
        <p id="resultado">Clique no botão acima para testar o hardware do celular.</p>
    </div>

    <!-- Linkando o script da funcionalidade -->
    <script src="app.js"></script>

    <!-- Código que registra o Service Worker para funcionar offline -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker funcionou!'))
            .catch((err) => console.log('Erro no Service Worker:', err));
        });
      }
    </script>
</body>
</html>
